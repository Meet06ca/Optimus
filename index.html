<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimus - Sovereign AI Platform</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 20px;
            padding: 30px;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            text-align: center;
        }
        .avatar-container {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 20px auto;
            background: linear-gradient(45deg, #38bdf8, #818cf8);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.5);
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
            50% { transform: scale(1.05); box-shadow: 0 0 30px rgba(56, 189, 248, 0.8); }
            100% { transform: scale(1); box-shadow: 0 0 15px rgba(56, 189, 248, 0.4); }
        }
        .avatar-emoji {
            font-size: 55px;
        }
        h1 {
            color: #38bdf8;
            margin: 0 0 5px 0;
            font-size: 24px;
        }
        p {
            color: #94a3b8;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .btn {
            background: linear-gradient(90deg, #0284c7, #0ea5e9);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 10px;
            width: 100%;
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }
        .btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }
        .admin-box {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.1);
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: white;
            box-sizing: border-box;
            outline: none;
        }
        input:focus {
            border-color: #38bdf8;
        }
        #status-msg {
            margin-top: 12px;
            font-size: 14px;
            font-weight: 500;
        }
        .hidden-panel {
            display: none;
            margin-top: 15px;
            background: rgba(15, 23, 42, 0.8);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #10b981;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- Cute AI Avatar Profile -->
        <div class="avatar-container">
            <div class="avatar-emoji">✨</div>
        </div>

        <h1>Optimus AI</h1>
        <p>Sovereign Smart Assistant & Companion</p>
        
        <button class="btn" onclick="startVoice()">🎙️ Start Voice Engine</button>

        <div class="admin-box">
            <label style="font-size: 12px; color: #38bdf8; font-weight: 600;">ADMIN CONTROL ACCESS:</label>
            <input type="password" id="passkey" placeholder="Enter Master Passkey">
            <button class="btn" style="background: linear-gradient(90deg, #059669, #10b981);" onclick="checkPasskey()">Unlock Admin Panel</button>
            <div id="status-msg"></div>

            <!-- Secret Admin Panel (Unlocked via 'jai mataji') -->
            <div id="adminPanel" class="hidden-panel">
                <p style="color: #34d399; margin:0 0 10px 0; font-weight: bold;">🔓 Master Panel Unlocked Successfully!</p>
                <button class="btn" style="background: #6366f1; padding: 8px; font-size: 13px;" onclick="alert('System Diagnostics: All Modules Green & Secure.')">Run System Check</button>
            </div>
        </div>
    </div>

    <script>
        function startVoice() {
            alert('Optimus Voice Engine Initialized! Listening for commands...');
        }

        function checkPasskey() {
            const val = document.getElementById('passkey').value.trim();
            const msg = document.getElementById('status-msg');
            const panel = document.getElementById('adminPanel');

            if(val === 'jai mataji') {
                msg.style.color = '#34d399';
                msg.innerHTML = '✨ Access Granted! Welcome Master.';
                panel.style.display = 'block';
            } else {
                msg.style.color = '#f87171';
                msg.innerHTML = '❌ Invalid Passkey. Try again.';
                panel.style.display = 'none';
            }
        }
    </script>

</body>
</html>
