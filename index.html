        .card { background: #18181b; padding: 20px; border-radius: 15px; margin-top: 20px; border: 1px solid #3f3f46; }
        .btn { background: #f43f5e; color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; width: 100%; }
    </style>
</head>

    <div class="app">
        <div class="header">

            <span onclick="alert('Admin Panel Locked. Use passkey: jai mataji')">⚙️</span>

            <div class="card">
