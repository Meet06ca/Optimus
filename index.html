<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimus - Sovereign Platform</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: #111827;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid #1f2937;
        }
        h1 {
            color: #3b82f6;
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            color: #9ca3af;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }
        .avatar-box {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px auto;
            border-radius: 50%;
            background: radial-gradient(circle, #3b82f6 0%, #1e40af 70%, #000 100%);
            box-shadow: 0 0 20px #3b82f6;
            animation: pulse 2s infinite ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
        }
        @keyframes pulse {
            0% { transform: scale(0.98); box-shadow: 0 0 15px #3b82f6; }
            50% { transform: scale(1.03); box-shadow: 0 0 30px #60a5fa; }
            100% { transform: scale(0.98); box-shadow: 0 0 15px #3b82f6; }
        }
        .btn {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #1d4ed8;
        }
        .passkey-section {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #374151;
        }
        input[type="password"] {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #1f2937;
            color: #fff;
            text-align: center;
            outline: none;
            margin-bottom: 10px;
            width: 80%;
        }
        #secret-panel {
            display: none;
            margin-top: 15px;
            color: #10b981;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OPTIMUS</h1>
        <p>Sovereign Platform & AI Assistant</p>

        <div class="avatar-box">🤖</div>

        <button class="btn" onclick="startVoice()">🎙️ Start Voice Engine</button>

        <div class="passkey-section">
            <p style="font-size: 0.8rem;">Admin Access</p>
            <input type="password" id="passkey" placeholder="Enter Master Passkey">
            <br>
            <button class="btn" style="padding: 8px 16px; font-size: 0.85rem; background: #374151;" onclick="checkPasskey()">Unlock Admin</button>
            <div id="secret-panel">🔓 Admin Access Granted! Welcome Master.</div>
        </div>
    </div>

    <script>
        function startVoice() {
            alert("Voice Engine Activated! Optimus is listening...");
        }

        function checkPasskey() {
            const pass = document.getElementById("passkey").value;
            if (pass === "jai mataji") {
                document.getElementById("secret-panel").style.display = "block";
            } else {
                alert("Incorrect Passkey!");
            }
        }
    </script>

</body>
</html>
