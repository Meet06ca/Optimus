<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Social - Sovereign 3D Anime & Global Ecosystem</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body {
            background: #000000;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-frame {
            width: 100%; max-width: 430px; height: 100vh; max-height: 900px;
            background: #0f1015; display: flex; flex-direction: column; position: relative; overflow: hidden;
            box-shadow: 0 0 50px rgba(236,72,153,0.3);
        }
        @media(min-width: 431px) {
            .app-frame { border-radius: 35px; border: 8px solid #27272a; height: 880px; }
        }

        /* Top Header */
        .app-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 18px; background: #0f1015; border-bottom: 1px solid rgba(255,255,255,0.08);
            z-index: 50;
        }
        .app-title { font-size: 19px; font-weight: 800; background: linear-gradient(45deg, #f43f5e, #8b5cf6, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .header-icons { display: flex; gap: 14px; font-size: 18px; cursor: pointer; }

        /* Content Area */
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 75px; }

        /* Instagram Style Mini Stories Tray */
        .stories-container {
            display: flex; gap: 10px; padding: 10px 14px; overflow-x: auto;
            border-bottom: 1px solid rgba(255,255,255,0.05); background: #14151a;
        }
        .story-item { display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer; flex-shrink: 0; }
        .story-ring {
            width: 52px; height: 52px; border-radius: 50%;
            background: linear-gradient(45deg, #f43f5e, #ec4899, #8b5cf6);
            display: flex; justify-content: center; align-items: center; padding: 1.5px;
        }
        .story-img { width: 48px; height: 48px; background: #000; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; border: 2px solid #0f1015; }
        .story-name { font-size: 9px; color: #a1a1aa; text-transform: lowercase; }

        /* Real 3D Anime Companion Stage */
        .anime-3d-stage {
            margin: 14px; padding: 18px;
            background: linear-gradient(135deg, rgba(244,63,94,0.18), rgba(139,92,246,0.12));
            border-radius: 24px; border: 1px solid rgba(244, 63, 94, 0.4);
            text-align: center; position: relative; overflow: hidden;
            box-shadow: 0 10px 30px rgba(244,63,94,0.15);
        }
        .anime-avatar-3d {
            font-size: 70px;
            animation: float3D 3s ease-in-out infinite;
            filter: drop-shadow(0 10px 20px rgba(244,63,94,0.6));
            cursor: pointer;
            display: inline-block;
        }
        @keyframes float3D {
            0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-8px) rotate(3deg) scale(1.05); }
        }
        .anime-status { font-size: 11px; background: rgba(244,63,94,0.25); color: #fca5a5; padding: 3px 12px; border-radius: 12px; display: inline-block; margin-top: 8px; border: 1px solid rgba(244,63,94,0.4); }

        /* Social Feed Post */
        .feed-card { background: #14151a; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .post-header { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; }
