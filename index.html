<!DOCTYPE html>
<html lang="gu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimus - Sovereign Autonomous AI</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #090d16, #1e1b4b, #0f172a);
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(56, 189, 248, 0.4);
            border-radius: 24px;
            padding: 28px;
            max-width: 520px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7);
            text-align: center;
        }
        .avatar-container {
            width: 95px;
            height: 95px;
            margin: 0 auto 15px auto;
            background: linear-gradient(45deg, #38bdf8, #a855f7, #6366f1);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.6);
            animation: pulse 2.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(168,85,247,0.4); }
            50% { transform: scale(1.06); box-shadow: 0 0 40px rgba(56,189,248,0.8); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(168,85,247,0.4); }
        }
        .avatar-emoji { font-size: 45px; }
        h1 { color: #38bdf8; font-size: 24px; }
        p { color: #94a3b8; font-size: 13px; margin-bottom: 15px; }
        .autonomous-badge {
            display: inline-block;
            background: rgba(168, 85, 247, 0.2);
            color: #c084fc;
            border: 1px solid #a855f7;
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            margin-bottom: 12px;
            animation: glow 1.5s infinite alternate;
        }
        @keyframes glow {
            from { border-color: #a855f7; box-shadow: 0 0 5px rgba(168,85,247,0.3); }
            to { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56,189,248,0.6); }
        }
        .btn {
            background: linear-gradient(90deg, #6366f1, #a855f7);
            color: white; border: none; padding: 12px 20px;
            border-radius: 12px; cursor: pointer; font-size: 14px;
            font-weight: 600; margin-top: 10px; width: 100%; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
        }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); }
        
        /* Autonomous Feed & Chat */
        .ai-terminal {
            margin-top: 18px;
            background: rgba(15, 23, 42, 0.95);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            text-align: left;
        }
        .terminal-logs {
            height: 130px;
            overflow-y: auto;
            font-size: 12px;
            font-family: monospace;
            color: #34d399;
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input {
            width: 100%; padding: 10px 14px; border-radius: 10px;
            border: 1px solid #475569; background: #0f172a; color: white;
            outline: none; font-size: 13px;
        }
        input:focus { border-color: #a855f7; }
        
        .admin-box {
            margin-top: 18px; padding-top: 12px;
            border-top: 1px solid rgba(255,255,255,0.1); text-align: left;
        }
        .hidden-panel {
            display: none; margin-top: 12px; background: rgba(15, 23, 42, 0.95);
            padding: 12px; border-radius: 12px; border: 1px solid #38bdf8;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="autonomous-badge">⚡ AUTONOMOUS AI & SELF-UPDATING ENGINE</div>
        
        <div class="avatar-container">
            <div class="avatar-emoji">🔮</div>
        </div>

        <h1>Optimus Neural AI</h1>
        <p>Self-Evolving Sovereign Platform</p>
        
        <button class="btn" onclick="triggerAutoEvolution()">🧬 Scan Web & Auto-Evolve</button>

        <!-- Live Terminal / AI Interaction -->
        <div class="ai-terminal">
            <div class="terminal-logs" id="terminalLogs">
                <div>[SYSTEM]: Optimus Neural Core v3.0 online.</div>
                <div>[AUTO-UPDATE]: AI learning from live web vectors...</div>
            </div>
            <div class="input-row">
                <input type="text" id="aiCommand" placeholder="Ask Optimus to build feature..." onkeypress="handleKey(event)">
                <button class="btn" style="width: auto; margin:0; padding: 10px 14px;" onclick="sendAICommand()">Run</button>
            </div>
        </div>

        <!-- Master Admin Control -->
        <div class="admin-box">
            <label style="font-size: 11px; color: #38bdf8; font-weight: 600;">MASTER OVERRIDE ACCESS:</label>
            <div style="display: flex; gap: 8px; margin-top: 5px;">
                <input type="password" id="passkey" placeholder="Enter Passkey">
                <button class="btn" style="width: auto; margin:0; background: #10b981;" onclick="checkMaster()">Unlock</button>
            </div>
            <div id="status-msg" style="font-size: 11px; margin-top: 4px;"></div>

            <div id="adminPanel" class="hidden-panel">
                <p style="color: #34d399; font-weight: bold; font-size: 12px;">🔓 Master Core Unlocked</p>
                <button class="btn" style="background: #ef4444; padding: 6px; font-size: 11px; margin-top: 6px;" onclick="clearMemory()">Clear Autonomous Cache</button>
            </div>
        </div>
    </div>

    <script>
        // Load Autonomous Customizations
        window.onload = function() {
            const savedState = localStorage.getItem('optimus_autonomous_state');
            if(savedState) {
                document.getElementById('terminalLogs').innerHTML += `<div>[RESTORED]: Loaded previous autonomous evolution state.</div>`;
            }
        };

        function logToTerminal(text) {
            const logs = document.getElementById('terminalLogs');
            logs.innerHTML += `<div>> ${text}</div>`;
            logs.scrollTop = logs.scrollHeight;
        }

        function triggerAutoEvolution() {
            logToTerminal("Scanning global web patterns & modern UI standards...");
            setTimeout(() => {
                logToTerminal("Analyzing competitor frameworks & design trends...");
            }, 1000);
            setTimeout(() => {
                logToTerminal("✨ Success: Neural core optimized new interface weights!");
                alert("🧬 Optimus successfully analyzed web trends and auto-updated neural weights!");
            }, 2200);
        }

        function sendAICommand() {
            const input = document.getElementById('aiCommand');
            const cmd = input.value.trim();
            if(cmd !== "") {
                logToTerminal(`User Request: ${cmd}`);
                input.value = "";
                
                setTimeout(() => {
                    logToTerminal(`Optimus AI: Generating modules for '${cmd}'... Done!`);
                }, 800);
            }
        }

        function handleKey(e) {
            if(e.key === 'Enter') sendAICommand();
        }

        function checkMaster() {
            const val = document.getElementById('passkey').value.trim();
            const msg = document.getElementById('status-msg');
            const panel = document.getElementById('adminPanel');

            if(val.toLowerCase() === 'jai mataji') {
                msg.style.color = '#34d399';
                msg.innerHTML = '✨ Master Sovereign Verified.';
                panel.style.display = 'block';
            } else {
                msg.style.color = '#f87171';
                msg.innerHTML = '❌ Incorrect passkey.';
                panel.style.display = 'none';
            }
        }

        function clearMemory() {
            localStorage.removeItem('optimus_autonomous_state');
            alert("Autonomous state cleared.");
            location.reload();
        }
    </script>

</body>
</html>
